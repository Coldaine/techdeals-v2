[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "techdeals"
version = "0.1.0"
description = "Data pipeline for parsing hardware marketplace listings using LLMs"
requires-python = ">=3.12"
dependencies = [
    "instructor",
    "pydantic>=2.0",
    "pydantic-settings",
    "psycopg[binary]",
    "asyncpg",
    "httpx",
    "python-dotenv",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
techdeals = "techdeals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/techdeals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/techdeals/parser/prompts.py" = ["E501"]